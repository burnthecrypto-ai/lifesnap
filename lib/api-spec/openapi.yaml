openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: LifeSnap API - Voice-first life command assistant
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: snapshots
    description: LifeSnap snapshot operations
  - name: process
    description: AI processing operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /process:
    post:
      operationId: processInput
      tags: [process]
      summary: Process life situation input
      description: Takes text input and mode, returns a diary entry and structured LifeSnap Snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessInput"
      responses:
        "200":
          description: Processing complete
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessResult"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /snapshots:
    get:
      operationId: listSnapshots
      tags: [snapshots]
      summary: List all saved snapshots
      responses:
        "200":
          description: List of snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snapshot"

    post:
      operationId: createSnapshot
      tags: [snapshots]
      summary: Save a LifeSnap snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnapshotInput"
      responses:
        "201":
          description: Snapshot saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"

  /snapshots/{id}:
    get:
      operationId: getSnapshot
      tags: [snapshots]
      summary: Get a specific snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Snapshot found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteSnapshot
      tags: [snapshots]
      summary: Delete a snapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ProcessInput:
      type: object
      required: [text, mode]
      properties:
        text:
          type: string
          description: The raw life situation text input from the user
        mode:
          type: string
          description: "The mode of input: ai_recommended, life_admin, health, legal, business, legacy, diary"
          enum:
            - ai_recommended
            - life_admin
            - health
            - legal
            - business
            - legacy
            - diary

    DiaryEntry:
      type: object
      required: [content, createdAt]
      properties:
        content:
          type: string
          description: Short personal diary entry text
        createdAt:
          type: string
          description: ISO 8601 timestamp

    SnapshotData:
      type: object
      required:
        - situationSummary
        - keyFacts
        - timeline
        - peopleInvolved
        - missingInformation
        - risksAndDeadlines
        - nextThreeActions
        - tags
        - shareableSummary
      properties:
        situationSummary:
          type: string
        keyFacts:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        peopleInvolved:
          type: array
          items:
            type: string
        missingInformation:
          type: array
          items:
            type: string
        risksAndDeadlines:
          type: array
          items:
            type: string
        nextThreeActions:
          type: array
          items:
            type: string
          maxItems: 3
        tags:
          type: array
          items:
            type: string
        shareableSummary:
          type: string

    TimelineEvent:
      type: object
      required: [date, event]
      properties:
        date:
          type: string
        event:
          type: string

    ProcessResult:
      type: object
      required: [diaryEntry, snapshot, mode]
      properties:
        diaryEntry:
          $ref: "#/components/schemas/DiaryEntry"
        snapshot:
          $ref: "#/components/schemas/SnapshotData"
        mode:
          type: string

    SnapshotInput:
      type: object
      required: [originalText, mode, diaryEntry, snapshot]
      properties:
        originalText:
          type: string
        mode:
          type: string
        diaryEntry:
          $ref: "#/components/schemas/DiaryEntry"
        snapshot:
          $ref: "#/components/schemas/SnapshotData"
        title:
          type: ["string", "null"]

    Snapshot:
      type: object
      required: [id, originalText, mode, diaryEntry, snapshot, createdAt]
      properties:
        id:
          type: integer
        title:
          type: ["string", "null"]
        originalText:
          type: string
        mode:
          type: string
        diaryEntry:
          $ref: "#/components/schemas/DiaryEntry"
        snapshot:
          $ref: "#/components/schemas/SnapshotData"
        createdAt:
          type: string
